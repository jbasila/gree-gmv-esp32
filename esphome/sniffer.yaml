# Phase 0/1: passive CAN sniffer. LISTENONLY never ACKs or transmits, so it cannot upset the VRF.
# Change bit_rate until frames decode with zero bus errors. Adjust pins to your board.
esphome:
  name: vrf-sniffer

esp32:
  board: esp32dev             # ESP32-WROOM-32D, chip ESP32-D0WD-V3 rev 3.1
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"   # ESPHome requires >= 2.0 for 20KBPS on classic ESP32

logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    canbus: INFO        # silence the generic "received can message" line, we print our own

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome

canbus:
  - platform: esp32_can
    id: vrf_can
    tx_pin: GPIO26         # silkscreen P26 -> CTX; still required in LISTENONLY
    rx_pin: GPIO27         # silkscreen P27 -> CRX
    mode: LISTENONLY
    can_id: 0
    bit_rate: 20KBPS       # confirmed by the CoolAutomation gateway: "GMV5 Speed:20000"
    on_frame:
      # Compact one-line format: F <std|ext> <id hex> <rtr> <hex bytes>
      - can_id: 0
        can_id_mask: 0
        use_extended_id: true
        then:
          - lambda: |-
              char buf[3 * 8 + 1]; int n = 0;
              for (auto b : x) n += snprintf(buf + n, sizeof(buf) - n, "%02X ", b);
              ESP_LOGI("F", "X %08X %d %s", can_id, remote_transmission_request, buf);
      - can_id: 0
        can_id_mask: 0
        use_extended_id: false
        then:
          - lambda: |-
              char buf[3 * 8 + 1]; int n = 0;
              for (auto b : x) n += snprintf(buf + n, sizeof(buf) - n, "%02X ", b);
              ESP_LOGI("F", "S %03X %d %s", can_id, remote_transmission_request, buf);

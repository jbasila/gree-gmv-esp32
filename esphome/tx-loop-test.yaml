# Diagnostic: can our transceiver make the bus dominant? No CAN driver here, raw GPIO.
# Every 2 s: sample RX 50x while idle, then 10x pull TX low for 30 us and sample RX during the pulse.
esphome:
  name: vrf-node
  includes:
    - gpio_test.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome

interval:
  - interval: 2s
    then:
      - lambda: |-
          gpio_reset_pin(GPIO_NUM_26); gpio_reset_pin(GPIO_NUM_27);
          gpio_set_direction(GPIO_NUM_27, GPIO_MODE_INPUT);
          gpio_set_direction(GPIO_NUM_26, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_26, 1);
          esp_rom_delay_us(200);
          int idle_low = 0;
          for (int i = 0; i < 50; i++) { idle_low += gpio_get_level(GPIO_NUM_27) == 0; esp_rom_delay_us(100); }
          int pulse_low = 0;
          for (int i = 0; i < 10; i++) {
            gpio_set_level(GPIO_NUM_26, 0);
            esp_rom_delay_us(30);
            pulse_low += gpio_get_level(GPIO_NUM_27) == 0;
            gpio_set_level(GPIO_NUM_26, 1);
            esp_rom_delay_us(5000);
          }
          ESP_LOGI("loop", "rx low while idle: %d/50   rx low while tx driven low: %d/10", idle_low, pulse_low);

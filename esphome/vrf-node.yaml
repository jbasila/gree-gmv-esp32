# Phase 2: first active node. NORMAL mode (ACKs frames, can transmit).
# Exposes test buttons that power the Bedroom 2 unit (node 0xD100, fan mode) on and off.
# Keeps the sniffer logging so the unit's reply is visible in the same log.
esphome:
  name: vrf-node
  includes:
    - twai_status.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"

logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    canbus: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome

canbus:
  - platform: esp32_can
    id: vrf_can
    tx_pin: GPIO26
    rx_pin: GPIO27
    can_id: 0
    bit_rate: 20KBPS
    on_frame:
      - can_id: 0
        can_id_mask: 0
        use_extended_id: true
        then:
          - lambda: |-
              char buf[3 * 8 + 1]; int n = 0;
              for (auto b : x) n += snprintf(buf + n, sizeof(buf) - n, "%02X ", b);
              ESP_LOGI("F", "X %08X %d %s", can_id, remote_transmission_request, buf);

interval:
  - interval: 5s
    then:
      - lambda: |-
          twai_status_info_t st;
          if (twai_get_status_info(&st) == ESP_OK) {
            ESP_LOGI("twai", "state=%d tec=%u rec=%u tx_failed=%u tx_queued=%u rx_missed=%u bus_err=%u arb_lost=%u",
                     (int) st.state, (unsigned) st.tx_error_counter, (unsigned) st.rx_error_counter,
                     (unsigned) st.tx_failed_count, (unsigned) st.msgs_to_tx, (unsigned) st.rx_missed_count,
                     (unsigned) st.bus_error_count, (unsigned) st.arb_lost_count);
          } else {
            ESP_LOGW("twai", "status unavailable");
          }

button:
  - platform: template
    name: "Bedroom 2 power ON"
    id: test_parents_on
    on_press:
      - canbus.send:
          canbus_id: vrf_can
          use_extended_id: true
          can_id: 0x1CBFD16F
          data: [0x00, 0x01, 0x01]   # node 0xD100, type 0x6F, offset 0, 1 byte: power = 1
  - platform: template
    name: "Bedroom 2 power OFF"
    id: test_parents_off
    on_press:
      - canbus.send:
          canbus_id: vrf_can
          use_extended_id: true
          can_id: 0x1CBFD16F
          data: [0x00, 0x01, 0x00]

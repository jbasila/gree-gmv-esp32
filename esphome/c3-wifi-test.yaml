# Diagnostic: does the ESP32-C3 SuperMini join WiFi? Its chip antenna sits next to the crystal,
# so full TX power often fails to associate; 8.5 dB is the usual fix. Logs RSSI every 10 s.
esphome:
  name: c3-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

api:
ota:
  platform: esphome

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 10s

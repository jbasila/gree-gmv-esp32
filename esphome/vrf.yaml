# The real thing: five climate entities for Home Assistant.
# Requires a transceiver that can drive the Gree bus (TJA1051T/3 based); see docs/HANDOFF.md.
esphome:
  name: vrf
  friendly_name: VRF
  project:
    name: jbasila.gree-gmv-esp32
    version: "0.1.0"

# Lets the ESPHome dashboard adopt a device flashed with this config.
dashboard_import:
  package_import_url: github://jbasila/gree-gmv-esp32/esphome/vrf.yaml@main

esp32:
  board: esp32-c3-devkitm-1   # ESP32-C3 SuperMini
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    canbus: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB   # SuperMini chip antenna sits next to the crystal; full power fails to associate

api:
  encryption:
    key: !secret vrf_api_key

ota:
  platform: esphome

external_components:
  - source: github://jbasila/gree-gmv-esp32@main
    refresh: 10min
    # For local development on a checkout use instead:
    #   source: { type: local, path: ../components }

canbus:
  - platform: esp32_can
    id: vrf_can
    tx_pin: GPIO4
    rx_pin: GPIO3
    can_id: 0
    bit_rate: 20KBPS

gree_gmv:
  canbus_id: vrf_can

climate:
  - platform: gree_gmv
    name: "Living Room"
    address: 0xD000
  - platform: gree_gmv
    name: "Bedroom 1"
    address: 0xD080
  - platform: gree_gmv
    name: "Bedroom 2"
    address: 0xD100
  - platform: gree_gmv
    name: "Bedroom 3"
    address: 0xD180
  - platform: gree_gmv
    name: "Bedroom 4"
    address: 0xD200
